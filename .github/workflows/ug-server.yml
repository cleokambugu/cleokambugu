name: UG server

on:
  push:
    paths: ['projects/ug/**']
  pull_request:
    paths: ['projects/ug/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: projects/ug/server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm run export-data
      - run: npm test
  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: projects/ug
          file: projects/ug/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ug:latest,ghcr.io/${{ github.repository_owner }}/ug:${{ github.sha }}
