<style>
:root{--ground:#0F0C0A;--surface:#1E1915;--ink:#F4ECDD;--yellow:#F2C200;--red:#D2202F;--crane:#94A8B6;--u:1px;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink)}
#app{position:fixed;inset:0;background:var(--ground);display:grid;place-items:center;font-family:Archivo,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:min(100vw,177.777vh);aspect-ratio:16/9;overflow:hidden;background:var(--ground);outline:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#cap{position:absolute;left:8%;right:8%;bottom:9.5%;text-align:center;pointer-events:none}
#cap .eb{font:600 calc(var(--u)*12) Archivo,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow);margin-bottom:calc(var(--u)*10);opacity:0}
#cap .main{font:700 calc(var(--u)*30)/1.2 Archivo,system-ui,sans-serif;text-wrap:balance;opacity:0;text-shadow:0 2px 24px rgba(15,12,10,.9)}
#cap .sub{font:400 calc(var(--u)*17)/1.4 Archivo,system-ui,sans-serif;color:rgba(244,236,221,.72);margin-top:calc(var(--u)*10);opacity:0;text-wrap:balance;text-shadow:0 2px 16px rgba(15,12,10,.9)}
#cap .in{animation:rise 1.15s cubic-bezier(.16,1,.3,1) forwards}
#cap .sub.in{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*16));filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
#hud{position:absolute;left:0;right:0;bottom:3px;height:calc(var(--u)*44);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*22);font-size:calc(var(--u)*12);opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
#counter{display:flex;gap:calc(var(--u)*10);align-items:center;color:rgba(244,236,221,.7)}
#counter b{font:500 calc(var(--u)*12) "Martian Mono",monospace;color:var(--ink);font-variant-numeric:tabular-nums}
#counter i{font-style:normal;color:rgba(244,236,221,.4)}
.vlabel{color:rgba(244,236,221,.45);font:500 calc(var(--u)*11) "Martian Mono",monospace}
.btns{display:flex;gap:calc(var(--u)*8);align-items:center}
.btn{font:600 calc(var(--u)*12) Archivo,system-ui,sans-serif;color:var(--ink);background:rgba(30,25,21,.64);border:1px solid rgba(244,236,221,.14);box-shadow:inset 0 1px 0 rgba(244,236,221,.08);backdrop-filter:blur(8px);border-radius:999px;padding:calc(var(--u)*7) calc(var(--u)*14);cursor:pointer;line-height:1}
.btn:hover{border-color:rgba(244,236,221,.35)}
.btn.y{background:var(--yellow);color:#17120E;border-color:transparent}
.hint{color:rgba(244,236,221,.35);font:500 calc(var(--u)*11) "Martian Mono",monospace;margin-right:calc(var(--u)*6)}
#bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(244,236,221,.12)}
#bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .2s linear}
#poster{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 45%,#1E1915 0%,#0F0C0A 72%);z-index:5;transition:opacity .8s ease}
#poster.off{opacity:0;pointer-events:none}
#poster .col{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14);text-align:center}
#poster svg{width:calc(var(--u)*112);height:calc(var(--u)*112);color:var(--ink)}
#poster h1{margin:0;font:900 calc(var(--u)*76)/1 Archivo,system-ui,sans-serif;letter-spacing:-.02em}
#poster .cp{font:500 calc(var(--u)*16) "Martian Mono",monospace;color:rgba(244,236,221,.7);letter-spacing:.02em}
#play{margin-top:calc(var(--u)*18);width:calc(var(--u)*96);height:calc(var(--u)*96);border-radius:50%;background:var(--yellow);border:0;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 0 rgba(242,194,0,.45);animation:pulse 2.4s ease-out infinite}
#play svg{width:calc(var(--u)*38);height:calc(var(--u)*38);color:#17120E}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,194,0,.45)}100%{box-shadow:0 0 0 calc(var(--u)*26) rgba(242,194,0,0)}}
#poster .meta{font:600 calc(var(--u)*12) Archivo,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(244,236,221,.5)}
#end{position:absolute;left:0;right:0;bottom:15%;display:flex;justify-content:center;gap:calc(var(--u)*10);opacity:0;pointer-events:none;transition:opacity .6s}
#end.on{opacity:1;pointer-events:auto}
#end .btn{font-size:calc(var(--u)*14);padding:calc(var(--u)*12) calc(var(--u)*22)}
#static{display:none;max-width:760px;width:100%;box-sizing:border-box;padding:40px 28px;max-height:100vh;overflow:auto;font-size:16px;line-height:1.5}
#static header{display:flex;align-items:center;gap:18px;margin-bottom:8px}
#static header svg{width:64px;height:64px;color:var(--ink)}
#static h1{margin:0;font:900 44px/1 Archivo,system-ui,sans-serif}
#static .cp{font:500 15px "Martian Mono",monospace;color:rgba(244,236,221,.7);margin:4px 0 26px}
#static ol{padding-left:0;list-style:none;margin:0}
#static li{padding:14px 0;border-top:1px solid rgba(244,236,221,.12)}
#static li h2{margin:0 0 4px;font:700 17px Archivo,system-ui,sans-serif}
#static li h2 span{font:500 12px "Martian Mono",monospace;color:var(--yellow);margin-right:10px}
#static li p{margin:2px 0;color:rgba(244,236,221,.8)}
#static li p.s{color:rgba(244,236,221,.55);font-size:14px}
#static .note{margin-top:22px;font:500 12px "Martian Mono",monospace;color:rgba(244,236,221,.45)}

/* ---------- the particle map ---------- */
const MAP = (() => {
  const land = GEO.land;
  const bb = {minLon:1e9,maxLon:-1e9,minLat:1e9,maxLat:-1e9};
  for (const p of land){ bb.minLon=Math.min(bb.minLon,p[0]); bb.maxLon=Math.max(bb.maxLon,p[0]); bb.minLat=Math.min(bb.minLat,p[1]); bb.maxLat=Math.max(bb.maxLat,p[1]); }
  // Lake rings whose coordinates fall outside the country box are data errors (Lake George in this file); skip them.
  const lakes = Object.values(GEO.lakes).filter(r => r.some(p => p[0]>bb.minLon-1 && p[0]<bb.maxLon+1 && p[1]>bb.minLat-1 && p[1]<bb.maxLat+1));
  const r = rng(11);
  const pts = [];
  const step = 0.062;
  for (let lat=bb.minLat; lat<=bb.maxLat; lat+=step) for (let lon=bb.minLon; lon<=bb.maxLon; lon+=step){
    const x = lon+(r()-.5)*step*.8, y = lat+(r()-.5)*step*.8;
    if (!inRing(land,x,y)) continue;
    const lake = lakes.some(k => inRing(k,x,y));
    pts.push({lon:x, lat:y, kind: lake?2:(r()<.16?1:0), ox:(r()*2-1)*820, oy:(r()*2-1)*520, d:r()*1.5+(lake?.7:0), ph:r()*6.28, sz: lake?1.9:(1.5+r()*1.1)});
  }
  for (let i=0;i<land.length;i++){ const a=land[i], b=land[(i+1)%land.length]; const n=Math.max(1,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/.03));
    for (let j=0;j<n;j++){ const u=j/n; pts.push({lon:lerp(a[0],b[0],u), lat:lerp(a[1],b[1],u), kind:3, ox:(r()*2-1)*820, oy:(r()*2-1)*520, d:r()*1.2, ph:r()*6.28, sz:2.3}); } }
  const centre = [(bb.minLon+bb.maxLon)/2, (bb.minLat+bb.maxLat)/2];
  const span = bb.maxLat-bb.minLat;
  function proj(cx, cy, h){ const k=h/span; const p=(lon,lat)=>[cx+(lon-centre[0])*k, cy-(lat-centre[1])*k]; return {k, p, t:name=>p(TOWNS[name][0],TOWNS[name][1])}; }
  const cols=[C.ink, C.yellow, C.crane, C.ink], al=[.72,.9,.85,1];
  function draw(ctx, P, o={}){
    const assemble = o.assemble==null ? 1e9 : o.assemble, now=o.now||0, alpha=o.alpha==null?1:o.alpha, breathe=o.breathe==null?1:o.breathe;
    for (let kind=0; kind<4; kind++){
      ctx.fillStyle=cols[kind]; ctx.globalAlpha=alpha*al[kind];
      for (const q of pts){ if (q.kind!==kind) continue;
        const [tx,ty]=P.p(q.lon,q.lat); let x=tx, y=ty;
        if (assemble < q.d+2.4){ const a=E.outExpo(seg(assemble,q.d,q.d+2.4)); x=lerp(640+q.ox,tx,a); y=lerp(360+q.oy,ty,a); }
        const b=Math.sin(now*1.3+q.ph)*.7*breathe;
        ctx.fillRect(x-q.sz/2+b, y-q.sz/2-b*.5, q.sz, q.sz);
      }
    }
    ctx.globalAlpha=1;
  }
  return {draw, proj, count: pts.length, lakes: lakes.length};
})();

      fetch(TRACK,{method:'HEAD',cache:'no-store'}).then(r=>{ if(!r.ok||!/audio|octet/.test(r.headers.get('content-type')||'')) throw 0; track=new Audio(TRACK); track.crossOrigin='anonymous'; trackGain=ac.createGain(); trackGain.gain.value=1; ac.createMediaElementSource(track).connect(trackGain); trackGain.connect(master); track.currentTime=Math.max(0,clock); track.play().catch(()=>{}); const vl=document.getElementById('vlabel'); if(vl) vl.textContent=(vl.textContent||'').replace(/ · music.*$/,'')+' · produced track'; }).catch(()=>{ if(!score) startScore(); });
    } else startScore(); }
  function cue(i){ if(score && CUT!=='short') score.cue(i); if(track && Math.abs(track.currentTime-clock)>.6) track.currentTime=clock; }
  function tick(){ }
  function sting(){ }
  function duck(on){ if(score) score.duck(on); if(trackGain&&ac) trackGain.gain.setTargetAtTime(on?.4:1,ac.currentTime,.06); }
  function pause(){ if(ac) ac.suspend(); if(track) track.pause(); } function resume(){ if(ac) ac.resume(); if(track){ track.currentTime=clock; track.play().catch(()=>{}); } }
  function setMuted(m){ muted=m; if(master&&ac) master.gain.setTargetAtTime(m?0:.9,ac.currentTime,.05); }
  return {start,tick,sting,cue,duck,pause,resume,setMuted,get muted(){return muted;}};
})() : null;

/* narration: rendered Ugandan voices (voice/manifest.json, see voice/README.md) when present; else the browser voice, labelled as a placeholder */
const voice = SOUND ? (() => {
  let v=null, manifest=null, files={}, cur=[], label=$('vlabel');
  const pick=()=>{ if(!('speechSynthesis' in window)) return; const vs=speechSynthesis.getVoices(); const pref=['en-UG','en-KE','en-TZ','en-NG','en-ZA','en-GB']; for(const p of pref){ v=vs.find(x=>x.lang.replace('_','-').toLowerCase()===p.toLowerCase()); if(v) break; } v = v || vs.find(x=>/^en/i.test(x.lang)) || vs[0] || null; if(label&&!manifest) label.textContent = v ? `placeholder voice · ${v.name.replace(/Microsoft |Google /,'')}` : 'placeholder voice'; };
  if('speechSynthesis' in window){ pick(); speechSynthesis.addEventListener('voiceschanged',pick); }
  fetch('voice/manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(m=>{ if(!m||!m.scenes) return; manifest=m; m.scenes.forEach(sc=>{ files[sc.id]=sc.files.map(f=>'voice/'+f.file); }); if(label) label.textContent='Ugandan voices · '+(m.engine||'rendered').split('/').pop(); }).catch(()=>{});
  function stopAll(){ cur.forEach(a=>{ try{ a.pause(); }catch(e){} }); cur=[]; if(audio&&audio.duck) audio.duck(false); try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }
  function playFiles(list){ let i=0; if(audio.duck) audio.duck(true); const next=()=>{ if(i>=list.length){ if(audio.duck) audio.duck(false); return; } const a=new Audio(list[i++]); a.volume=1; cur=[a]; a.addEventListener('ended',()=>setTimeout(next,260)); a.play().catch(()=>{}); }; next(); }
  return { say(sceneId, lines){ if(audio.muted) return; stopAll(); if(manifest&&files[sceneId]){ playFiles(files[sceneId]); return; } if(!('speechSynthesis' in window)) return; try{ if(audio.duck) audio.duck(true); lines.forEach((l,i)=>{ const u=new SpeechSynthesisUtterance(l); if(v) u.voice=v; u.rate=.96; u.pitch=.98; if(i===lines.length-1){ u.onend=()=>{ if(audio.duck) audio.duck(false); }; u.onerror=u.onend; } speechSynthesis.speak(u); }); }catch(e){} },
    stop(){ stopAll(); }, pause(){ cur.forEach(a=>{ try{ a.pause(); }catch(e){} }); try{ if('speechSynthesis' in window) speechSynthesis.pause(); }catch(e){} }, resume(){ cur.forEach(a=>{ a.play().catch(()=>{}); }); try{ if('speechSynthesis' in window) speechSynthesis.resume(); }catch(e){} },
    get rendered(){ return !!manifest; } };
})() : null;

/* ---------- player ---------- */
let clock=0, playing=false, started=false, ended=false, sceneI=-1, capI=-1, lastTs=0;
function setCaption(c){ const set=(el,s)=>{ el.classList.remove('in'); el.textContent=s||''; if(s){ void el.offsetWidth; el.classList.add('in'); } }; set(capEb,c&&c.eb); set(capMain,c&&c.main); set(capSub,c&&c.sub); }
function enterScene(i,{sting=true}={}){ sceneI=i; capI=-1; setCaption(null); cnt.textContent=`${String(i+1).padStart(2,'0')} / ${SCENES.length}`; cname.textContent=SCENES[i].name; if(audio&&audio.cue) audio.cue(i); if(voice) voice.say(SCENES[i].id, SCENES[i].voice); }
function goto(i){ i=clamp(i,0,SCENES.length-1); clock=OFFSET[i]; if(ended){ ended=false; endEl.classList.remove('on'); } enterScene(i); if(!playing) setPlaying(true); }
function setPlaying(p){ playing=p; if(audio){ p?audio.resume():audio.pause(); } if(voice){ p?voice.resume():voice.pause(); } hint.textContent = p ? 'space · ← →' : 'paused · space'; }
function finish(){ playing=false; ended=true; endEl.classList.add('on'); hint.textContent='ended · r to replay'; if(audio) audio.pause(); }
function start(){ if(started) return; started=true; if(audio) audio.start(); poster.classList.add('off'); hud.classList.add('on'); if(SOUND){ muteBtn.hidden=false; const vl=$('vlabel'); if(vl) vl.hidden=false; } stage.focus({preventScroll:true}); clock=0; playing=true; lastTs=performance.now(); enterScene(0,{sting:false}); requestAnimationFrame(loop); }

let RENDERING=false, capT0=0;
function loop(ts){ if(!RENDERING) requestAnimationFrame(loop); const dt=RENDERING?0:Math.min(.1,(ts-lastTs)/1000); lastTs=ts; if(playing&&!RENDERING){ clock+=dt; if(clock>=TOTAL){ clock=TOTAL-.001; finish(); } }
  let i=SCENES.length-1; while(i>0&&clock<OFFSET[i]) i--; if(i!==sceneI) enterScene(i); const sc=SCENES[i], t=clock-OFFSET[i];
  let ci=-1; for(let k=0;k<sc.caps.length;k++) if(sc.caps[k].at<=t) ci=k; if(ci!==capI){ capI=ci; capT0=clock; setCaption(ci>=0?sc.caps[ci]:null); }
  barfill.style.width=(clock/TOTAL*100)+'%';
  if(audio&&playing) audio.tick(clock);
  ctx.setTransform(dpr*S,0,0,dpr*S,0,0); ctx.fillStyle=C.ground; ctx.fillRect(-2,-2,W+4,H+4);
  ctx.save(); camApply(ctx, clock); sc.draw({ctx,now:clock,dur:sc.dur},t); ctx.restore();
  ctx.globalAlpha=1; if('filter' in ctx) ctx.filter='none'; fade(ctx,t,sc.dur,i===SCENES.length-1);
  if(!playing&&!ended&&!RENDERING){ ctx.fillStyle='rgba(15,12,10,.35)'; ctx.fillRect(0,0,W,H); pill(ctx,'paused',640,360,{font:FONT.body(700,14),h:36,px:28}); } }

/* ---------- controls ---------- */
playBtn.addEventListener('click',start);
skipBtn.addEventListener('click',()=>{ if(!started) return start(); if(sceneI>=SCENES.length-1){ clock=TOTAL-.001; finish(); } else goto(sceneI+1); });
$('replay').addEventListener('click',()=>goto(0));
muteBtn.addEventListener('click',()=>{ if(!audio) return; const m=!audio.muted; audio.setMuted(m); if(m&&voice) voice.stop(); muteBtn.textContent=m?'Unmute':'Mute'; });
stage.addEventListener('keydown',e=>{ if(!started){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); start(); } return; }
  if(e.key===' '){ e.preventDefault(); if(ended) goto(0); else setPlaying(!playing); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); if(sceneI<SCENES.length-1) goto(sceneI+1); else { clock=TOTAL-.001; finish(); } }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); const t=clock-OFFSET[sceneI]; goto(t>2?sceneI:sceneI-1); }
  else if(e.key==='m'||e.key==='M'){ muteBtn.click(); } else if(e.key==='r'||e.key==='R'){ goto(0); } });
document.addEventListener('keydown',e=>{ if(document.activeElement!==stage && (e.key===' '||e.key.startsWith('Arrow'))){ stage.focus({preventScroll:true}); stage.dispatchEvent(new KeyboardEvent('keydown',{key:e.key})); e.preventDefault(); } });

/* fonts, then go */
const fontsReady = Promise.race([ (document.fonts ? Promise.all([document.fonts.load('800 40px Archivo'),document.fonts.load('700 20px Archivo'),document.fonts.load('600 14px Archivo'),document.fonts.load('500 14px "Martian Mono"')]) : Promise.resolve()).catch(()=>{}), new Promise(r=>setTimeout(r,2500)) ]);
if (!SOUND) fontsReady.then(()=>setTimeout(start,900));
window.__UG_REEL = {cut:CUT, sound:SOUND, total:TOTAL, voiceLines:SCENES.map(s=>({id:s.id, at:0, lines:s.voice})),
  render(sec){ if(poster&&poster.isConnected) poster.remove(); if(!started){ RENDERING=true; started=true; hud.classList.add('on'); if(SOUND) muteBtn.hidden=false; stage.focus({preventScroll:true}); } RENDERING=true; playing=false; ended=false; hud.style.display='none'; $('bar').style.display='none'; endEl.style.display='none'; clock=clamp(sec,0,TOTAL-.001); let i=SCENES.length-1; while(i>0&&clock<OFFSET[i]) i--; if(i!==sceneI){ sceneI=i; capI=-1; cnt.textContent=`${String(i+1).padStart(2,'0')} / ${SCENES.length}`; cname.textContent=SCENES[i].name; } loop(performance.now()); const ms=Math.max(0,(clock-capT0)*1000); document.getAnimations().forEach(a=>{ a.pause(); try{ a.currentTime=ms; }catch(e){} }); barfill.style.transition='none'; endEl.classList.toggle('on', clock>=TOTAL-.05); return {scene:SCENES[i].id, t:clock-OFFSET[i]}; },
  offsets:OFFSET.slice(), scenes:SCENES.map(s=>({id:s.id,name:s.name,dur:s.dur})), particles:MAP.count, lakes:MAP.lakes, seek(sec){ if(!started) start(); clock=clamp(sec,0,TOTAL-.001); let i=SCENES.length-1; while(i>0&&clock<OFFSET[i]) i--; enterScene(i,{sting:false}); }, get clock(){return clock;}, get playing(){return playing;}};
})();
</script>
